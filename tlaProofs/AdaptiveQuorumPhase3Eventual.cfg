SPECIFICATION LiveSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Keys = {k1}
    Servers = {s1, s2, s3}
    Coordinators = {c1, c2}
    Values = {v1, v2}

    RH_R = 1
    RH_W = 3

    WH_R = 3
    WH_W = 1

    MaxTS = 2
    MaxEpoch = 2

    EnablePolicySwitch = TRUE
    EnableReadsDuringDraining = FALSE

INVARIANT TypeInvariant
INVARIANT LastWriteReplicasCorrect
INVARIANT TimestampBoundedByLatest
INVARIANT IdleCoordinatorHoldsNoLock

PROPERTY EventualConsistency